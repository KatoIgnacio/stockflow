# Instancia independiente: las pruebas nunca borran datos de stockflow en el puerto 5432.
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stockflow_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stockflow_test"]
      interval: 2s
      timeout: 5s
      retries: 20
