spring.application.name=stockflow
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockflow}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Ejemplos listos para la presentación. Puede desactivarse con DEMO_DATA_ENABLED=false.
stockflow.demo.enabled=${DEMO_DATA_ENABLED:true}

server.error.include-message=never
server.error.include-stacktrace=never
